# #CheckInSis campaign data. Edit this file to publish approved Honor Wall
# entries or update the fallback counter — the page reads both via Liquid.

# Static fallback shown until the live Cloudflare counter is connected (Stage 3).
counter_fallback: 247

# Approved Honor Wall entries only. Add an entry here after a human has
# reviewed the Google Form submission — this is the only source the public
# Honor Wall section reads from.
#   name, dedication     — required
#   honored_by           — optional, shown as "Honored by ..."
#   tag                  — optional: Survivor / Warrior / In Loving Memory
#   photo                — optional, path under /assets/
#   permission_confirmed — true/false. The photo and tag only ever render
#                          when this is true, regardless of whether those
#                          fields are filled in.
honor_wall: []
# Example entry (remove the leading "# " on each line to activate):
#   - name: "Sister's Name"
#     dedication: "Short dedication text."
#     honored_by: "Optional — omit to leave blank."
#     tag: "Survivor"
#     photo: "/assets/honor-wall/example.jpg"
#     permission_confirmed: true
