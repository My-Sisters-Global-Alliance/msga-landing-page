<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} | MySGA{% else %}MySGA | Educate. Equip. Empower.{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
{% if page.og_image %}
<meta property="og:title" content="{% if page.title %}{{ page.title }} | MySGA{% else %}MySGA{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ page.og_image | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} | MySGA{% else %}MySGA{% endif %}">
<meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<meta name="twitter:image" content="{{ page.og_image | absolute_url }}">
{% endif %}
<meta name="theme-color" content="#083E7D">
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Petit+Formal+Script&display=swap" rel="stylesheet">
<style>
/*
Brand palette + type sourced from the official
"My Sisters Global Alliance Style Guide" (SinVista Creations).
Colors: #cd7817 / #2c69b1 / #083e7d / #fec338 / #082149
Fonts: Montserrat Bold (headings/UI), Al Fresco (signature accent - licensed, see note below).
Note: Petit Formal Script (Google Fonts, free) is used as a temporary stand-in
for the licensed Al Fresco accent font on the homepage hero headline only,
pending purchase of an Al Fresco web-font license. Swap --font-accent-hero
to Al Fresco once licensed.
*/
:root{
--navy:#083E7D;
--navy-dark:#082149;
--blue:#2C69B1;
--gold:#FEC338;
--gold-light:#FEDB88;
--orange:#CD7817;
--ivory:#FFFFFF;
--champagne:#FBF3D9;
--pink:#F7B6CF;
--pink-deep:#B83A6E;
--pink-accent:#C2477A;
--teal:#2C69B1;
--text:#1C2430;
--muted:#4B5563;
--font-base:'Montserrat','Helvetica Neue',Helvetica,Arial,sans-serif;
--font-accent:'Al Fresco','Brush Script MT',cursive;
--font-accent-hero:'Petit Formal Script','Al Fresco','Brush Script MT',cursive;
--radius-sm:6px;
--radius-md:12px;
--radius-lg:24px;
--shadow-sm:0 2px 10px rgba(8,33,73,0.08);
--shadow-md:0 12px 28px rgba(8,33,73,0.14);
--shadow-lg:0 24px 60px rgba(8,33,73,0.22);
--ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
font-family:var(--font-base);
color:var(--text);
background:var(--ivory);
line-height:1.6;
-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
font-family:var(--font-base);
font-weight:800;
color:var(--navy);
line-height:1.2;
}
img{max-width:100%;}
.sr-only{
position:absolute;width:1px;height:1px;padding:0;margin:-1px;
overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.skip-link{
position:absolute;left:12px;top:-60px;background:var(--gold);color:var(--navy-dark);
padding:10px 18px;border-radius:var(--radius-sm);font-weight:700;z-index:200;
transition:top .2s var(--ease);
}
.skip-link:focus{top:12px;}
a{color:inherit;text-decoration:none;}
a:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:4px;}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;}

/* Buttons */
.btn{
display:inline-flex;align-items:center;justify-content:center;gap:8px;
padding:16px 34px;
border-radius:var(--radius-sm);
font-weight:700;
font-size:0.95rem;
letter-spacing:0.02em;
cursor:pointer;
border:2px solid transparent;
transition:transform .2s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease), color .2s var(--ease);
white-space:nowrap;
}
.btn-gold{background:var(--gold);color:var(--navy-dark);box-shadow:var(--shadow-sm);}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-3px);box-shadow:var(--shadow-md);}
.btn-gold:active{transform:translateY(-1px);}
.btn-outline{background:transparent;border-color:rgba(255,255,255,0.7);color:var(--ivory);}
.btn-outline:hover{background:rgba(255,255,255,0.12);border-color:#fff;transform:translateY(-3px);}
.btn-ghost{background:transparent;border-color:var(--navy);color:var(--navy);}
.btn-pink{background:var(--pink);color:var(--navy);box-shadow:var(--shadow-sm);}
.btn-pink:hover{background:#ffd0e3;transform:translateY(-3px);box-shadow:var(--shadow-md);}
.btn-ghost:hover{background:var(--navy);color:#fff;transform:translateY(-3px);box-shadow:var(--shadow-md);}
.btn-sm{padding:10px 20px;font-size:0.82rem;border-radius:999px;}

/* Header */
header{
position:sticky;top:0;z-index:50;
background:rgba(255,255,255,0.96);
backdrop-filter:blur(6px);
border-bottom:1px solid var(--champagne);
box-shadow:0 1px 8px rgba(16,59,100,0.06);
}
header .wrap{
display:flex;align-items:center;justify-content:space-between;
padding-top:12px;padding-bottom:12px;
position:relative;
}
.logo-mark{display:flex;align-items:center;flex-shrink:0;}
.logo-mark img{height:44px;width:auto;display:block;}
nav ul{list-style:none;display:flex;align-items:center;}
nav a{color:var(--navy);font-size:0.9rem;font-weight:600;padding:8px 2px;position:relative;}
nav ul li:not(.nav-btn-item) a::after{
content:"";position:absolute;left:0;right:100%;bottom:0;height:2px;background:var(--gold);
transition:right .2s var(--ease);
}
nav ul li:not(.nav-btn-item) a:hover::after,
nav ul li:not(.nav-btn-item) a.active::after{right:0;}
nav a:hover{color:var(--blue);}
nav a.active{color:var(--blue);}
.nav-btn-item{margin-left:6px;}
.mobile-toggle{
display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
width:40px;height:40px;padding:0;background:none;border:none;cursor:pointer;flex-shrink:0;
}
.mobile-toggle span{display:block;width:22px;height:2px;background:var(--navy);border-radius:1px;transition:transform .2s var(--ease), opacity .2s var(--ease);}
@media(max-width:899px){
nav{
display:none;
position:absolute;top:100%;left:0;right:0;
background:#fff;border-bottom:1px solid var(--champagne);
box-shadow:0 8px 20px rgba(16,59,100,0.12);
}
nav.open{display:block;}
nav ul{display:flex;flex-direction:column;align-items:stretch;padding:4px 24px 20px;}
nav ul li{border-top:1px solid var(--champagne);}
nav ul li:first-child{border-top:none;}
nav ul li a{display:block;padding:14px 0;}
.nav-btn-item{margin-left:0;padding-top:12px;}
.nav-btn-item a{display:inline-flex;padding:12px 24px;}
nav ul li.nav-btn-item::after{display:none;}
}
@media(min-width:900px){
.mobile-toggle{display:none;}
nav ul{gap:22px;}
}
@media(min-width:900px) and (max-width:1180px){
nav ul{gap:14px;}
nav a{font-size:0.82rem;}
.btn-sm{padding:9px 16px;font-size:0.76rem;}
}

/* Section scaffolding */
section{position:relative;}
section[id]{scroll-margin-top:88px;}
.section-head{max-width:680px;margin-bottom:44px;}
.section-head.center{margin-left:auto;margin-right:auto;text-align:center;}
.eyebrow{
display:inline-block;color:var(--gold);
font-size:0.78rem;letter-spacing:0.18em;text-transform:uppercase;
font-weight:700;
}
.section-head .eyebrow{color:var(--blue);}
/* Brand name must never be forced to all-caps by an uppercase eyebrow/label context */
.brand-case{text-transform:none;}
.accent-bar{width:56px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--gold),var(--orange));margin:14px 0 18px;}
.section-head.center .accent-bar{margin-left:auto;margin-right:auto;}
.section-head h2{font-size:clamp(1.7rem,3vw,2.4rem);}
.section-head p{color:var(--muted);font-size:1.02rem;margin-top:14px;}

.wave-divider{display:block;width:100%;height:64px;margin-top:-2px;}
.wave-divider svg{display:block;width:100%;height:100%;}

/* ================================================================
   Homepage Hero — approved redesign (Sterling brief, Romona-approved)
   Two-column, full-bleed photo on the right, status bar above,
   script accent on "Women and Girls". Scoped to .hero-v3 only —
   does not affect .page-hero (About / Our Work / Contact headers).
   ================================================================ */
.hero-status-bar{background:#05142f;padding:10px 0;}
.hero-status-inner{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;font-size:0.76rem;}
.status-left{color:var(--gold);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:7px;}
.status-left svg{flex:none;}
.status-divider{color:rgba(255,255,255,0.28);}
.status-right{color:rgba(255,255,255,0.82);font-weight:500;}
@media(max-width:640px){.status-divider{display:none;}.status-right{width:100%;}}

.hero-v3{background:linear-gradient(160deg,var(--navy-dark) 0%,#04101f 100%);color:#fff;position:relative;overflow:hidden;}
.hero-v3-row{display:flex;flex-wrap:wrap;align-items:center;}
.hero-v3-text{flex:1 1 460px;max-width:600px;padding:56px 40px 56px 24px;display:flex;flex-direction:column;justify-content:center;}
.hero-v3-image-col{flex:1 1 420px;position:relative;aspect-ratio:4/3;max-height:640px;}
.hero-v3-image-col img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;}
.hero-v3 h1{font-weight:800;color:#fff;line-height:1.16;font-size:clamp(1.85rem,3.2vw,2.5rem);margin-bottom:2px;letter-spacing:-0.01em;}
.headline-script{display:block;font-family:var(--font-accent-hero);font-weight:400;color:var(--gold);font-size:clamp(1.9rem,3vw,2.5rem);line-height:1.2;margin-bottom:18px;white-space:nowrap;}
@media(max-width:520px){.headline-script{white-space:normal;}}
.hero-v3 p.lead{font-size:clamp(1rem,1.5vw,1.1rem);color:var(--champagne);max-width:500px;margin-bottom:28px;opacity:0.95;}
.hero-v3-actions{display:flex;flex-wrap:wrap;gap:14px;}

@media(max-width:959px){
.hero-v3-row{flex-direction:column;align-items:stretch;flex-wrap:nowrap;}
.hero-v3-text{order:1;max-width:none;padding:36px 24px 32px;}
.hero-v3-image-col{order:2;max-height:420px;min-width:0;}
.hero-v3-actions{flex-direction:column;}
.hero-v3-actions .btn{width:100%;}
}

/* Legacy Hero (Home) rules — no longer referenced by index.html now that
   the hero uses .hero-v3 above, kept only in case any other template
   still points at .hero / .hero-visual-card. Safe to remove later. */
.hero{
background:linear-gradient(160deg,var(--navy) 0%,var(--navy-dark) 100%);
color:var(--ivory);
padding:80px 0 0;
position:relative;
overflow:hidden;
}
.hero::after{
content:"";
position:absolute;right:-140px;top:-140px;
width:460px;height:460px;border-radius:50%;
background:radial-gradient(circle,rgba(254,195,56,0.16) 0%,rgba(254,195,56,0) 70%);
}
.hero::before{
content:"";
position:absolute;left:-160px;bottom:-160px;
width:420px;height:420px;border-radius:50%;
background:radial-gradient(circle,rgba(44,105,177,0.28) 0%,rgba(44,105,177,0) 70%);
}
.hero .wrap{position:relative;z-index:1;padding-bottom:72px;}
.hero-grid{display:grid;grid-template-columns:1fr;gap:52px;align-items:center;text-align:center;}
@media(min-width:960px){
.hero-grid{grid-template-columns:1.05fr 0.95fr;text-align:left;gap:56px;}
.hero-actions{justify-content:flex-start;}
.hero-copy .eyebrow-row{justify-content:flex-start;}
.hero p.lead{margin-left:0;margin-right:0;}
}
.eyebrow-row{display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
.hero .eyebrow{color:var(--gold);}
.hero h1{font-size:clamp(2.15rem,4.6vw,3.4rem);color:var(--ivory);line-height:1.14;margin-bottom:20px;letter-spacing:-0.01em;}
.hero h1 em{font-style:normal;color:var(--gold);}
.hero p.lead{font-size:clamp(1.05rem,2vw,1.22rem);color:var(--champagne);max-width:560px;margin:0 auto 32px;}
.hero-actions{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:18px;}
.hero-note{font-size:0.85rem;color:rgba(241,231,210,0.7);}
.hero-note strong{color:var(--gold-light);}

.hero-visual{position:relative;display:flex;justify-content:center;}
.hero-visual-card{
position:relative;width:100%;max-width:400px;
background:
radial-gradient(circle,rgba(255,255,255,0.16) 1.5px,transparent 1.5px) 0 0/22px 22px,
linear-gradient(150deg,rgba(255,255,255,0.10),rgba(255,255,255,0.02));
border:1px solid rgba(255,255,255,0.16);
border-radius:var(--radius-lg);
padding:36px 30px 84px;
text-align:center;
backdrop-filter:blur(2px);
}
.hero-status-badge{
position:absolute;top:18px;right:18px;z-index:2;
display:inline-flex;align-items:center;gap:6px;
background:rgba(8,33,73,0.55);border:1px solid rgba(255,255,255,0.3);
color:var(--champagne);font-size:0.68rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
padding:6px 12px;border-radius:999px;backdrop-filter:blur(4px);
}
.hero-status-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0;box-shadow:0 0 0 3px rgba(254,195,56,0.25);}
.hero-visual-logo{
display:inline-flex;align-items:center;justify-content:center;
width:120px;height:120px;border-radius:50%;background:#fff;
box-shadow:var(--shadow-lg);margin:0 auto 22px;padding:16px;
}
.hero-visual-logo img{width:100%;height:auto;}
.hero-pillars-badge{
display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center;
font-size:0.78rem;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;
color:var(--champagne);
}
.hero-pillars-badge span{padding:6px 12px;border:1px solid rgba(255,255,255,0.35);border-radius:999px;}
.hero-quote-card{
position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);
width:calc(100% - 24px);max-width:360px;
background:#fff;color:var(--navy);border-radius:var(--radius-md);
box-shadow:var(--shadow-lg);padding:20px 22px;text-align:left;
}
.hero-quote-card p{font-size:0.98rem;font-weight:600;line-height:1.5;}
.hero-quote-card span{display:block;margin-top:8px;font-size:0.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.hero-visual-card--simple{padding:24px;}
.hero-visual-card--simple .hero-visual-logo{width:220px;height:220px;margin:0 auto;}

/* Page header (About / Our Work / Contact — simpler than the Home hero) */
.page-hero{
background:linear-gradient(160deg,var(--navy) 0%,var(--navy-dark) 100%);
color:var(--ivory);
padding:76px 0 92px;
position:relative;
overflow:hidden;
}
.page-hero::after{
content:"";
position:absolute;right:-120px;top:-120px;
width:360px;height:360px;border-radius:50%;
background:radial-gradient(circle,rgba(254,195,56,0.14) 0%,rgba(254,195,56,0) 70%);
}
.page-hero .wrap{position:relative;z-index:1;max-width:760px;text-align:center;}
.page-hero .eyebrow{color:var(--gold);}
.page-hero h1{color:var(--ivory);font-size:clamp(2rem,4vw,2.8rem);margin:16px 0;}
.page-hero p{color:var(--champagne);font-size:1.05rem;max-width:600px;margin:0 auto;}

/* Audience wayfinding (Home) */
.involve{padding:100px 0 76px;background:var(--ivory);}
.involve-grid{display:grid;grid-template-columns:1fr;gap:24px;}
@media(min-width:700px){.involve-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1080px){.involve-grid{grid-template-columns:repeat(4,1fr);}}
.involve-card{
background:#fff;border:1px solid var(--champagne);border-radius:var(--radius-lg);
padding:34px 28px;box-shadow:var(--shadow-sm);
transition:transform .25s var(--ease), box-shadow .25s var(--ease);
display:flex;flex-direction:column;
}
.involve-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-md);}
.involve-icon{
width:56px;height:56px;border-radius:50%;
display:flex;align-items:center;justify-content:center;margin-bottom:20px;
}
.involve-card.supporters .involve-icon{background:rgba(254,195,56,0.18);color:var(--orange);}
.involve-card.seeking-support .involve-icon{background:rgba(44,105,177,0.14);color:var(--blue);}
.involve-card.partners .involve-icon{background:rgba(8,62,125,0.12);color:var(--navy);}
.involve-card.volunteers .involve-icon{background:rgba(44,105,177,0.14);color:var(--teal);}
.involve-card h3{font-size:1.18rem;margin-bottom:10px;}
.involve-card p{color:var(--muted);font-size:0.94rem;margin-bottom:22px;flex-grow:1;}

/* Impact stats */
.impact{padding:76px 0;background:var(--champagne);}
.impact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;margin-top:8px;}
.impact-card{
background:#fff;border-radius:var(--radius-md);padding:32px 22px;text-align:center;
box-shadow:var(--shadow-sm);border-top:4px solid var(--gold);
transition:transform .25s var(--ease), box-shadow .25s var(--ease);
}
.impact-card:nth-child(2){border-top-color:var(--blue);}
.impact-card:nth-child(3){border-top-color:var(--orange);}
.impact-card:nth-child(4){border-top-color:var(--navy);}
.impact-card:hover{transform:translateY(-6px) scale(1.015);box-shadow:var(--shadow-md);}
.impact-icon{width:30px;height:30px;margin:0 auto 10px;color:var(--gold);}
.impact-card:nth-child(2) .impact-icon{color:var(--blue);}
.impact-card:nth-child(3) .impact-icon{color:var(--orange);}
.impact-card:nth-child(4) .impact-icon{color:var(--navy);}
.stat-number{display:block;font-size:clamp(2.1rem,5vw,3rem);font-weight:800;color:var(--navy);line-height:1;}
.stat-caption{display:block;margin-top:10px;font-size:0.88rem;color:var(--muted);font-weight:600;}
.impact-footnote{margin-top:32px;font-size:0.85rem;color:var(--muted);text-align:center;}

/* Pillars */
.pillars{padding:88px 0;background:var(--ivory);}
.pillar-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px;}
.pillar-card{
background:#fff;border:1px solid var(--champagne);
padding:38px 30px;border-radius:var(--radius-md);
border-top:3px solid var(--blue);
transition:transform .25s var(--ease), box-shadow .25s var(--ease);
}
.pillar-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-md);}
.pillar-num{
font-family:var(--font-base);font-size:0.85rem;color:var(--gold);
letter-spacing:0.1em;font-weight:700;margin-bottom:14px;display:block;
}
.pillar-card h3{font-size:1.3rem;margin-bottom:12px;}
.pillar-card p{color:var(--muted);font-size:0.96rem;}

/* Our Work */
.programs{padding:88px 0;background:var(--champagne);}
.programs.on-white{background:var(--ivory);}
.program-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin-top:8px;}
.program-item{
background:var(--ivory);padding:26px 24px;border-radius:var(--radius-md);
border-left:4px solid var(--teal);
box-shadow:var(--shadow-sm);
transition:transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
display:flex;flex-direction:column;gap:12px;
}
.programs.on-white .program-item{background:var(--champagne);}
.program-item:hover{transform:translateY(-4px) translateX(2px);box-shadow:var(--shadow-md);border-color:var(--orange);}
.program-tag{
align-self:flex-start;background:rgba(44,105,177,0.1);color:var(--blue);
font-size:0.7rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;
padding:4px 10px;border-radius:999px;
}
.program-item h3{font-size:1.05rem;color:var(--navy);font-weight:700;}
.program-item p{font-size:0.9rem;color:var(--muted);line-height:1.55;flex-grow:1;}
.program-link{font-size:0.82rem;font-weight:700;color:var(--orange);text-decoration:underline;text-underline-offset:3px;align-self:flex-start;}
.program-link:hover{color:var(--navy);}
.programs-cta{margin-top:36px;text-align:center;font-size:0.95rem;color:var(--muted);}
